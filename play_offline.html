/* Roll call tally & vote ceremony */
.rollcall-dialog{max-width:680px;background:#fbf9f2}
.rollcall-wrap{text-align:center;padding:10px 0}
.rollcall-badge{display:inline-block;font:bold 10px monospace;letter-spacing:1.5px;background:#253b47;color:#eedca4;padding:6px 14px;border-radius:3px;margin-bottom:12px}
.rollcall-title{font:26px Georgia,serif;color:#1a2f2e;margin:0 0 6px}
.rollcall-sub{font-size:13px;color:var(--muted);margin-bottom:24px}
.tally-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:20px 0}
.tally-box{padding:16px;border-radius:4px;border:2px solid;background:#fff}
.tally-box.yea{border-color:#2b704c;background:#f0f7f2}
.tally-box.nay{border-color:#9c3c2b;background:#fbf2f0}
.tally-label{display:block;font:bold 11px monospace;letter-spacing:2px;margin-bottom:4px}
.tally-box.yea .tally-label{color:#215c3d}
.tally-box.nay .tally-label{color:#852b1b}
.tally-box strong{font:44px Georgia,serif;display:block;line-height:1}
.tally-box.yea strong{color:#1e5c3b}
.tally-box.nay strong{color:#8c2e1f}
.tally-needed{font-size:11px;color:var(--muted);margin-top:6px;display:block}
.roll-meter-wrap{position:relative;height:16px;background:#e2e6db;border-radius:3px;overflow:visible;margin:25px 0 15px}
.roll-meter-fill{height:100%;background:#3e7b57;border-radius:3px 0 0 3px;transition:width 0.1s linear}
.roll-threshold-marker{position:absolute;top:-6px;bottom:-6px;width:3px;background:#b58024;transform:translateX(-50%);z-index:2}
.roll-threshold-label{position:absolute;top:-20px;transform:translateX(-50%);font:bold 9px monospace;letter-spacing:1px;color:#8c6017;white-space:nowrap}
.roll-stamp-wrap{margin:24px 0 16px;animation:stamp-pop 0.35s cubic-bezier(0.175,0.885,0.32,1.275)}
.roll-stamp{display:inline-block;font:900 24px monospace;letter-spacing:3px;padding:8px 24px;border:4px solid;border-radius:4px;transform:rotate(-3deg);text-transform:uppercase}
.roll-stamp.stamp-pass{color:#1e6940;border-color:#1e6940;background:#edf7f0;box-shadow:0 0 0 3px #1e694040}
.roll-stamp.stamp-fail{color:#9c2e22;border-color:#9c2e22;background:#fdf1ef;box-shadow:0 0 0 3px #9c2e2240}
.roll-summary{font-size:13px;color:var(--ink);margin-top:14px;line-height:1.5}

/* Enactment & Resolution Ceremonies */
.ceremony{text-align:center;padding:10px 15px}
.ceremony-badge{display:inline-block;font:bold 9px monospace;letter-spacing:2px;background:#1c303d;color:#e4d39e;padding:6px 14px;border-radius:3px;margin-bottom:15px}
.ceremony h1{font:32px Georgia,serif;margin-bottom:8px;color:#15282a}
.ceremony-sub{font-size:14px;color:var(--muted);max-width:580px;margin:0 auto 20px}
.ceremony-parchment{background:#fffdf5;border:3px double #c9b986;box-shadow:0 4px 14px rgba(0,0,0,0.08);padding:24px 30px;text-align:left;margin:20px auto;max-width:620px;position:relative}
.parchment-header{border-bottom:1px solid #dfd4af;padding-bottom:14px;margin-bottom:14px;text-align:center}
.parchment-header span{display:block;font:bold 9px monospace;letter-spacing:1.5px;color:#7d6b42;margin-bottom:4px}
.parchment-header strong{display:block;font:24px Georgia,serif;letter-spacing:1px;color:#213334}
.parchment-header em{display:block;font-size:12px;color:#5d6756;font-style:italic;margin-top:4px}
.parchment-body p{font-size:13px;line-height:1.6;color:#243534;margin:8px 0}
.parchment-sign{display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid #dfd4af;padding-top:18px;margin-top:20px}
.sign-seal{font:bold 9px monospace;letter-spacing:1px;color:#a44832;border:2px solid #b54a33;padding:8px 12px;border-radius:50%;display:inline-block}
.sign-line{text-align:right;border-top:1px solid #233433;padding-top:4px;min-width:190px}
.sign-signature{display:block;font-family:Georgia,serif;font-style:italic;font-size:18px;color:#1e3545}
.sign-line small{font:bold 8px monospace;letter-spacing:1px;color:#6a7c73}

.autopsy-box{background:#fcf4f2;border:1px solid #e0c2bc;border-left:4px solid #ad3526;padding:18px 22px;margin:20px 0;text-align:left}
.autopsy-box h3{font:bold 14px Georgia,serif;color:#8c2518;margin:0 0 8px}
.autopsy-box p{font-size:13px;line-height:1.55;color:#382c2a;margin:6px 0}
.autopsy-point{margin:10px 0}
.autopsy-point strong{display:block;font-size:11px;letter-spacing:1px;color:#7a281e;margin-bottom:3px}
.autopsy-point span{font-size:13px;color:#2e363b}

.chamber-banner{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#243a46;color:#eedfa4;font:bold 10px monospace;letter-spacing:1.5px;border-radius:3px;margin-bottom:15px}
.chamber-banner.chamber-committee{background:#453724;color:#f0dca2}
.chamber-banner.chamber-house{background:#1e3c4d;color:#d8e8f2}
.chamber-banner.chamber-senate{background:#45283b;color:#f0d8e8}
.chamber-banner.chamber-agreement{background:#38452e;color:#e8f0d8}
.chamber-banner.chamber-executive{background:#182e38;color:#e8dcb8}

.hidden{display:none!important}
@keyframes stamp-pop{0%{transform:scale(1.6) rotate(-10deg);opacity:0}70%{transform:scale(0.95) rotate(-2deg);opacity:1}100%{transform:scale(1) rotate(-3deg)}}

const glossary = {
  "Agenda setting": "Choosing which problems or bills get attention and time on the schedule.",
  "Amendment": "A proposed change to a bill’s wording. The committee or chamber decides whether to adopt it.",
  "Bicameralism": "Having two legislative chambers. In Congress, the House and Senate must agree on the same text to pass a law.",
  "Calendar": "A list of bills that may be considered. Being listed does not guarantee a floor vote.",
  "Cloture": "A Senate procedure that limits further debate. For ordinary legislation, it normally needs three-fifths of senators duly chosen and sworn.",
  "Committee chair": "The member who leads a committee and has substantial control over what it considers.",
  "Conference committee": "Members from both chambers appointed to work out differences between their versions of a bill.",
  "Conference report": "The agreement reached by House and Senate negotiators. Each delegation must approve it, and each chamber then votes on it without floor amendments.",
  "Enumerated power": "A power listed in the Constitution, such as Congress’s power to regulate interstate commerce.",
  "Filibuster": "Using extended debate or other delaying procedures to block Senate action.",
  "Germaneness": "Whether an amendment is relevant to the bill. House amendments generally must be germane unless that requirement is waived.",
  "Hearing": "A meeting where a committee hears testimony and gathers information. A bill does not always need a hearing.",
  "Hold": "An informal notice that a senator intends to object to or delay action.",
  "Jurisdiction": "The subjects a committee is responsible for. It helps determine where a bill is referred.",
  "Markup": "A committee meeting to consider amendments and decide what text to report.",
  "Presentment": "Sending the bill to the president after both chambers have approved the same text.",
  "Rider": "A provision attached to a bill, often on a different subject.",
  "Session ticks": "A simulation of the limited legislative calendar in a two-year Congress. Under Article I and the 20th Amendment, a Congress lasts two years before adjourning sine die; any bills not enacted by then expire and must be reintroduced from scratch in the next Congress. In the game, actions consume ticks to reflect the time costs of committee hearings, markups, floor debates, cloture waiting periods, and bicameral reconciliation.",
  "Sponsor": "The member who introduces a bill. A co-sponsor signs on to support it.",
  "Standing committee": "A permanent committee that handles a particular set of subjects.",
  "Subcommittee": "A smaller group within a committee that handles more specialized work.",
  "Unanimous consent": "An agreement that can go ahead only if nobody objects.",
  "Veto": "The president returns an entire bill to Congress with objections.",
  "Veto override": "Both chambers vote by two-thirds to pass a returned bill despite the president’s objections."
};

function isWalkable(room,x,y,objects=[]){const [l,t,r,b]=rooms[room].size;if(x<=l||x>=r||y<=Math.max(t,2)||y>=b)return false;return !rooms[room].props.some(p=>p[0]===x&&p[1]===y)&&!objects.some(o=>o.x===x&&o.y===y&&o.type!=='door');}
function pathTo(room,start,target,objects){
 const queue=[start],seen=new Set([`${start.x},${start.y}`]),parent=new Map();let goal=null;
 for(let i=0;i<queue.length;i++){const p=queue[i];if(Math.abs(p.x-target.x)+Math.abs(p.y-target.y)<=1){goal=p;break;}for(const [dx,dy] of [[0,-1],[1,0],[0,1],[-1,0]]){const n={x:p.x+dx,y:p.y+dy},key=`${n.x},${n.y}`;if(!seen.has(key)&&isWalkable(room,n.x,n.y,objects)){seen.add(key);parent.set(key,p);queue.push(n);}}}
 if(!goal)return [];const result=[];while(goal.x!==start.x||goal.y!==start.y){result.unshift(goal);goal=parent.get(`${goal.x},${goal.y}`);}return result;
}

// --- world.js ---
function mountWorld(canvas, { phase, highest, location, onInteract, onRoom, onNearby, onMove = () => {}, blocked, amended = 0, reduced = () => false }) {
  const room = location.room;
  const layout = rooms[room];
  const objects = objectsFor(room, phase, highest);
  let player = { x: location.x ?? 11, y: location.y ?? 11 };
  let facing = 'down', last = 0, frame = 0, keys = new Set(), path = [], arrival = null, disposed = false, lastNear = '';
  const dpr = typeof window !== 'undefined' ? Math.min(window.devicePixelRatio || 1, 2) : 1;
  const ctx = canvas.getContext('2d');
  canvas.width = Math.round(W * T * dpr);
  canvas.height = Math.round(H * T * dpr);

  function nearest() {
    const fx = player.x + (facing === 'left' ? -1 : facing === 'right' ? 1 : 0);
    const fy = player.y + (facing === 'up' ? -1 : facing === 'down' ? 1 : 0);
    const frontObj = objects.find(o => o.x === fx && o.y === fy);
    if (frontObj) return frontObj;
    return objects.find(o => Math.abs(o.x - player.x) + Math.abs(o.y - player.y) <= 1) || null;
  }

  function rect(x, y, w, h, c) {
    ctx.fillStyle = c;
    ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  }

  // Draw living Bill player sprite with rich pixel details and animations
  function drawBill(x, y, dir, bob, walking) {
    // Drop shadow
    rect(x + 4, y + 19, 16, 4, '#10222a66');

    const lean = walking ? (dir === 'left' ? -1 : dir === 'right' ? 1 : 0) : 0;
    const px = x + 5 + lean;
    const py = y + 2 + bob;

    // Outer border / deckle edge
    rect(px, py, 14, 18, '#8e7039');
    // Parchment paper body
    rect(px + 1, py + 1, 12, 16, '#faedd0');
    // Paper interior texture
    rect(px + 2, py + 2, 10, 14, '#fff9e6');

    // Folded top-right corner
    rect(px + 9, py + 1, 4, 4, '#8e7039');
    rect(px + 10, py + 1, 3, 3, '#c29f58');
    rect(px + 11, py + 1, 2, 2, '#ebd594');
    rect(px + 9, py + 3, 2, 2, '#705423');

    // Simulated legislative lines
    rect(px + 3, py + 4, 5, 1, '#cdb37a');
    rect(px + 3, py + 6, 8, 1, '#d8c592');

    // Official wax seal & ribbon on chest
    rect(px + 8, py + 12, 4, 4, '#b03527');
    rect(px + 9, py + 13, 2, 2, '#eec55c');
    rect(px + 9, py + 16, 1, 2, '#962b1e');
    rect(px + 11, py + 16, 1, 2, '#962b1e');

    // Expressive Eyes with blinking
    const isBlinking = !reduced() && (frame % 130 < 6);
    let eyeY = py + 8;
    let eyeX1 = px + 4, eyeX2 = px + 8;
    if (dir === 'left') { eyeX1 = px + 3; eyeX2 = px + 6; }
    else if (dir === 'right') { eyeX1 = px + 6; eyeX2 = px + 9; }
    else if (dir === 'up') { eyeY = py + 7; }

    if (isBlinking || dir === 'up') {
      rect(eyeX1, eyeY + 1, 2, 1, '#2c373b');
      rect(eyeX2, eyeY + 1, 2, 1, '#2c373b');
    } else {
      rect(eyeX1, eyeY, 2, 2, '#202f34');
      rect(eyeX2, eyeY, 2, 2, '#202f34');
      // Eye reflection glint
      rect(eyeX1, eyeY, 1, 1, '#ffffff');
      rect(eyeX2, eyeY, 1, 1, '#ffffff');
    }

    // Friendly determined smile
    if (dir !== 'up') {
      rect(px + 5, py + 11, 4, 1, '#b5975d');
    }

    // Attached riders/amendments (colored seals pinned to document edge)
    const riderColors = ['#2f7053', '#39607e', '#b86e28'];
    for (let i = 0; i < Math.min(3, amended); i++) {
      const rx = px - 2;
      const ry = py + 7 + i * 3;
      rect(rx, ry, 3, 3, riderColors[i]);
      rect(rx + 1, ry + 1, 1, 1, '#e8cf82'); // brass pin
    }

    // Walking stride legs
    const stride = !reduced() && walking ? (Math.floor(frame / 6) % 2) : 0;
    rect(px + 3, py + 18, 3, 2 + stride, '#725629');
    rect(px + 8, py + 18, 3, 3 - stride, '#725629');
  }

  // Draw role-specific NPC sprites with distinct silhouettes
  function drawNPC(x, y, o, dir, near) {
    const bob = reduced() ? 0 : (Math.floor((frame + o.x * 7) / 28) % 2);
    // Shadow
    rect(x + 5, y + 19, 14, 4, '#10222a66');

    const px = x + 5;
    const py = y + 1 + bob;
    const color = o.color || '#8c9ea6';
    const id = o.id || '';

    // Head base (skin tone)
    const skin = (id === 'witness' || id === 'senator') ? '#d4ad88' : (id === 'caretaker') ? '#b88a68' : '#cba482';
    rect(px + 3, py + 2, 8, 8, skin);

    // Hair / Headwear styles by role
    if (id === 'senator' || id === 'main' && room === 'committee') {
      // Distinguished silver/grey side-parted hair
      rect(px + 2, py + 1, 10, 3, '#c2c8cf');
      rect(px + 1, py + 2, 2, 5, '#9aa1a8');
      rect(px + 10, py + 2, 2, 5, '#9aa1a8');
    } else if (id === 'caretaker') {
      // Blue utility service cap
      rect(px + 1, py, 11, 4, '#2d4352');
      rect(px + 2, py + 3, 10, 1, '#1b2c37');
    } else if (id === 'procedure' || id === 'archive') {
      // Academic hair with spectacles
      rect(px + 2, py + 1, 9, 3, '#6e523f');
      rect(px + 2, py + 3, 2, 4, '#553d2d');
      rect(px + 9, py + 3, 2, 4, '#553d2d');
    } else if (id === 'representative' || id === 'guide') {
      // Professional neat parted hairstyle
      rect(px + 2, py + 1, 10, 3, '#382a24');
      rect(px + 2, py + 3, 2, 5, '#382a24');
      rect(px + 9, py + 3, 2, 4, '#382a24');
    } else {
      // Standard professional hair
      rect(px + 2, py + 1, 10, 3, '#433732');
      rect(px + 2, py + 3, 2, 4, '#433732');
      rect(px + 9, py + 3, 2, 4, '#433732');
    }

    // Eyes and Facial expressions
    if (dir === 'up') {
      // Back of head
      rect(px + 2, py + 2, 10, 6, id === 'senator' ? '#c2c8cf' : id === 'caretaker' ? '#2d4352' : '#433732');
    } else {
      let ex1 = px + 4, ex2 = px + 8;
      if (dir === 'left') { ex1 = px + 3; ex2 = px + 6; }
      else if (dir === 'right') { ex1 = px + 6; ex2 = px + 9; }

      rect(ex1, py + 5, 2, 2, '#21272a');
      if (dir !== 'left' && dir !== 'right') rect(ex2, py + 5, 2, 2, '#21272a');

      // Glasses for parliamentarian / archivist
      if (id === 'procedure' || id === 'archive') {
        rect(px + 3, py + 4, 4, 3, 'rgba(180, 210, 230, 0.4)');
        rect(px + 7, py + 4, 4, 3, 'rgba(180, 210, 230, 0.4)');
        rect(px + 3, py + 4, 8, 1, '#7a91a0');
      }
    }

    // Body / Suit Coat
    rect(px + 1, py + 10, 12, 9, color);

    // Collar, Lapels, and Ties
    if (dir !== 'up') {
      rect(px + 5, py + 10, 4, 2, '#ffffff'); // shirt collar
      const tieColor = id === 'senator' ? '#7e2d3b' : id === 'representative' ? '#2f4f6e' : id === 'executive-aide' ? '#c99e46' : '#4a3f3a';
      rect(px + 6, py + 12, 2, 4, tieColor); // tie

      // Congressional Lapel Pin (gold badge)
      if (id === 'representative' || id === 'senator' || id === 'main') {
        rect(px + 3, py + 12, 2, 2, '#eec55c');
      }
      // ID Lanyard for aides/clerks
      if (id === 'staff' || id === 'leader' || id === 'negotiator') {
        rect(px + 5, py + 13, 4, 3, '#f2e8c4');
        rect(px + 6, py + 14, 2, 1, '#4a6572');
      }
      // Wooden gavel for committee chair
      if (room === 'committee' && o.id === 'main') {
        rect(px + 10, py + 13, 3, 2, '#a07038');
        rect(px + 11, py + 15, 1, 3, '#754f24');
      }
      // Book / Folio for Parliamentarian / Archivist
      if (id === 'procedure' || id === 'archive' || id === 'historian') {
        rect(px + 10, py + 12, 3, 5, '#782d22');
        rect(px + 11, py + 13, 2, 1, '#e8cf82');
      }
    } else {
      // Suit back seam
      rect(px + 6, py + 11, 2, 8, 'rgba(0,0,0,0.15)');
    }

    // Legs / Pants
    const pants = id === 'caretaker' ? '#24343f' : '#1e262d';
    rect(px + 3, py + 19, 3, 3, pants);
    rect(px + 8, py + 19, 3, 3, pants);
  }

  function draw() {
    if (disposed) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    frame++;

    // Base background
    rect(0, 0, W * T, H * T, '#0d161e');
    const [l, t, r, b] = layout.size;

    // 1. Draw floor and walls with architectural distinction
    for (let y = t; y <= b; y++) {
      for (let x = l; x <= r; x++) {
        const isWall = x === l || x === r || y < 3 || y === b;
        if (isWall) {
          rect(x * T, y * T, T, T, layout.walls);
          // Wall paneling or trim
          if (y === 2) {
            rect(x * T, y * T + 14, T, 6, '#b5a97f');
            rect(x * T, y * T + 20, T, 4, '#1b2a2b');
          } else if (y === 1) {
            rect(x * T, y * T + 2, T, 2, 'rgba(255,255,255,0.06)');
          }
        } else {
          // Floor rendering per room style
          if (room === 'corridor') {
            // Checkered marble Capitol floor
            const check = (x + y) % 2 === 0;
            rect(x * T, y * T, T, T, check ? '#5d756d' : '#526961');
            rect(x * T, y * T, T, 1, 'rgba(255, 255, 255, 0.08)');
            rect(x * T, y * T, 1, T, 'rgba(0, 0, 0, 0.08)');
          } else if (room === 'house') {
            // House blue carpet with border trim
            rect(x * T, y * T, T, T, '#496b79');
            if ((x * 5 + y * 7) % 8 === 0) rect(x * T + 8, y * T + 8, 4, 4, '#5c8191');
          } else if (room === 'senate') {
            // Senate crimson/purple carpet
            rect(x * T, y * T, T, T, '#674d6b');
            if ((x * 7 + y * 3) % 9 === 0) rect(x * T + 10, y * T + 10, 3, 3, '#7d5f82');
          } else if (room === 'committee') {
            // Warm wood parquet flooring
            rect(x * T, y * T, T, T, '#76684a');
            rect(x * T, y * T + 11, T, 1, '#615438');
            rect(x * T + 11, y * T, 1, T, '#615438');
          } else if (room === 'executive') {
            // Polished Oval Office parquet
            rect(x * T, y * T, T, T, '#5d7567');
          } else {
            // Default handsome tile
            rect(x * T, y * T, T, T, layout.floor);
            rect(x * T, y * T, T, 1, 'rgba(255, 255, 255, 0.07)');
            rect(x * T, y * T, 1, T, 'rgba(0, 0, 0, 0.07)');
          }
        }
      }
    }

    // 2. Specialized Chamber Architecture & Staging
    if (room === 'corridor') {
      // Marble neoclassical fluted columns along hallway walls (avoiding doors)
      for (const cx of [0, 4, 20, 23]) {
        rect(cx * T, 10, 20, 58, '#dce3d5');
        rect(cx * T + 2, 12, 16, 54, '#f0f5ea');
        rect(cx * T + 5, 14, 2, 50, '#cad4c0');
        rect(cx * T + 9, 14, 2, 50, '#cad4c0');
        rect(cx * T + 13, 14, 2, 50, '#cad4c0');
        rect(cx * T - 2, 10, 24, 4, '#c2cbba'); // capital
        rect(cx * T - 2, 64, 24, 5, '#a6b09e'); // base
      }
      // Grand central runner carpet
      rect(10 * T, 3 * T, 4 * T, 11 * T, '#753b3b');
      rect(10 * T, 3 * T, 2, 11 * T, '#e0be6c');
      rect(14 * T - 2, 3 * T, 2, 11 * T, '#e0be6c');
    } else if (room === 'house') {
      // Speaker's Rostrum backdrop & House Mace silhouette
      rect(10 * T, 20, 4 * T, 48, '#2a4454');
      rect(10 * T + 4, 22, 4 * T - 8, 44, '#39576b');
      // Gilded Eagle Crest on rostrum wall
      rect(11 * T + 12, 28, 24, 16, '#cca542');
      rect(11 * T + 18, 25, 12, 6, '#edd379');
      // Blue runner aisle
      rect(10 * T, 3 * T, 4 * T, 11 * T, '#345263');
      rect(10 * T, 3 * T, 2, 11 * T, '#d9be6f');
      rect(14 * T - 2, 3 * T, 2, 11 * T, '#d9be6f');
    } else if (room === 'senate') {
      // Vice President / Presiding Officer Dais & Walnut Canopy
      rect(10 * T, 18, 4 * T, 52, '#422838');
      rect(10 * T + 4, 22, 4 * T - 8, 44, '#56354a');
      // Senate seal & draped velvet swag
      rect(11 * T + 10, 26, 28, 14, '#bfa254');
      rect(10 * T + 6, 24, 3 * T + 12, 4, '#942b3d');
      // Crimson runner aisle with gold Greek key borders
      rect(10 * T, 3 * T, 4 * T, 11 * T, '#522b3e');
      rect(10 * T, 3 * T, 2, 11 * T, '#dfc476');
      rect(14 * T - 2, 3 * T, 2, 11 * T, '#dfc476');
    } else if (room === 'executive') {
      // Iconic Oval Office Medallion Rug
      rect(6 * T, 5 * T, 12 * T, 8 * T, '#2f515e');
      rect(6 * T + 6, 5 * T + 6, 12 * T - 12, 8 * T - 12, '#3c6677');
      rect(8 * T, 6 * T, 8 * T, 6 * T, '#487587');
      // Gold laurel wreath ring representation
      rect(7 * T, 5 * T + 10, 10 * T, 2, '#d4bc72');
      rect(7 * T, 13 * T - 12, 10 * T, 2, '#d4bc72');
    } else if (room === 'committee') {
      // Elevated Committee Dais Rostrum
      rect(8 * T, 3 * T + 12, 8 * T, 20, '#54422b');
      rect(8 * T + 2, 3 * T + 14, 8 * T - 4, 4, '#876b47');
      // Aisle
      rect(10 * T, 4 * T, 4 * T, 10 * T, '#67583f');
      rect(10 * T, 4 * T, 2, 10 * T, '#ba9e63');
      rect(14 * T - 2, 4 * T, 2, 10 * T, '#ba9e63');
    } else if (room === 'archive') {
      // Archive center runner
      rect(10 * T, 3 * T, 4 * T, 11 * T, '#6a5639');
      rect(10 * T, 3 * T, 2, 11 * T, '#cca864');
      rect(14 * T - 2, 3 * T, 2, 11 * T, '#cca864');
    }

    // 3. Tall Palladian Windows with Volumetric Light Shafts
    if (room !== 'corridor') {
      for (const wx of [l + 2, r - 3]) {
        // Window Frame
        rect(wx * T, 14, 44, 38, '#182736');
        rect(wx * T + 3, 16, 38, 32, '#5e858d');
        // Transom arch
        rect(wx * T + 6, 17, 32, 4, '#a2b8be');
        // Muntins (panes)
        rect(wx * T + 21, 16, 3, 33, '#d5cb9f');
        rect(wx * T + 2, 31, 40, 3, '#d5cb9f');
        // Warm angled light shaft
        ctx.fillStyle = room === 'executive' ? 'rgba(255, 245, 190, 0.08)' : 'rgba(210, 235, 230, 0.06)';
        ctx.beginPath();
        ctx.moveTo(wx * T, 52);
        ctx.lineTo(wx * T + 44, 52);
        ctx.lineTo(wx * T + 78, 175);
        ctx.lineTo(wx * T - 22, 175);
        ctx.fill();
      }
    }

    // 4. Glowing Wall Sconces with soft radial gradients
    const sconcePositions = room === 'corridor' ? [l + 1, l + 7, l + 14, r - 1] : [l + 1, r - 1];
    for (const sx of sconcePositions) {
      const px = sx * T + 12;
      const py = 35;
      // Brass torch bracket
      rect(px - 2, py + 2, 4, 8, '#9c8141');
      rect(px - 3, py + 1, 6, 2, '#d4b768');
      // Torch flame
      rect(px - 1, py - 3, 2, 4, '#f5d378');
      // Subtle ambient light radial halo
      const grad = ctx.createRadialGradient(px, py - 1, 2, px, py - 1, 26);
      grad.addColorStop(0, 'rgba(255, 228, 145, 0.22)');
      grad.addColorStop(1, 'rgba(255, 228, 145, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(px, py - 1, 26, 0, Math.PI * 2);
      ctx.fill();
    }

    // 5. Rich Props Rendering
    for (const [x, y, kind] of layout.props) {
      const px = x * T;
      const py = y * T;
      // Prop shadow
      rect(px + 2, py + 19, 25, 6, '#10222a55');

      if (kind === 'plant') {
        // Terracotta pot with gold band
        rect(px + 6, py + 13, 14, 11, '#946648');
        rect(px + 5, py + 12, 16, 3, '#ba8b68');
        rect(px + 7, py + 18, 12, 2, '#d6ab76');
        // Lush layered foliage
        rect(px + 2, py + 4, 22, 9, '#28523c');
        rect(px + 5, py - 2, 16, 14, '#3d7355');
        rect(px + 8, py - 4, 10, 10, '#5ba179');
      } else if (kind === 'flag') {
        // Brass flagpole with eagle finial
        rect(px + 4, py - 16, 2, 40, '#cfba78');
        rect(px + 3, py - 18, 4, 3, '#f0d98f');
        // Draped cloth
        const flagColor = room === 'senate' ? '#782d3b' : room === 'executive' ? (x < 12 ? '#244572' : '#8a2b38') : '#2f527c';
        rect(px + 6, py - 14, 16, 22, flagColor);
        // Gold fringe & tassel
        rect(px + 6, py + 8, 16, 2, '#ebd17a');
        rect(px + 8, py - 11, 4, 4, '#ffffff'); // star canton
      } else if (kind === 'shelf') {
        // Rich wooden bookcase
        rect(px, py - 14, 26, 38, '#453323');
        rect(px + 1, py - 13, 24, 36, '#2e2015');
        // Shelves
        rect(px + 1, py - 1, 24, 3, '#75593e');
        rect(px + 1, py + 11, 24, 3, '#75593e');
        // Multi-colored leather bound books with gold spine text
        const spineColors = ['#8f2d2b', '#284f6e', '#2e5e3a', '#946c2b', '#5c3968'];
        for (let i = 0; i < 6; i++) {
          rect(px + 2 + i * 4, py - 10, 3, 9, spineColors[i % spineColors.length]);
          rect(px + 2 + i * 4, py - 6, 3, 1, '#f2d480'); // gold tooling
          rect(px + 2 + i * 4, py + 2, 3, 9, spineColors[(i + 2) % spineColors.length]);
          rect(px + 2 + i * 4, py + 6, 3, 1, '#f2d480');
        }
      } else {
        // Desks & Chairs
        if (kind === 'chair') {
          // Leather upholstered chair with polished wooden frame
          rect(px + 3, py + 2, 20, 19, '#433425');
          const leather = room === 'senate' ? '#683547' : room === 'committee' ? '#2f5240' : '#2b4454';
          rect(px + 5, py + 4, 16, 14, leather);
          rect(px + 6, py + 5, 14, 2, 'rgba(255,255,255,0.15)');
        } else {
          // Polished Legislative Desk
          rect(px + 1, py + 3, 24, 18, '#4a3622');
          rect(px, py, 26, 17, '#785b3b');
          rect(px + 1, py + 1, 24, 3, '#a8865c');
          rect(px + 2, py + 6, 8, 8, '#594129'); // drawer
          rect(px + 16, py + 6, 8, 8, '#594129');

          // Desk Accessories
          if (kind.includes('paper')) {
            rect(px + 6, py + 4, 14, 10, kind === 'house-paper' ? '#2f5a7d' : '#6b2d4b');
            rect(px + 7, py + 5, 12, 8, '#f5ecd5');
            ctx.font = 'bold 7px monospace';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(kind === 'house-paper' ? 'HOUSE' : 'SENATE', px + 2, py - 4);
          } else {
            // Paper blotter and inkwell/microphone
            rect(px + 6, py + 4, 14, 9, '#2a3d47');
            rect(px + 8, py + 5, 10, 7, '#f7f0dc');
            // Small brass desk lamp or mic
            rect(px + 2, py + 2, 3, 4, '#cca849');
          }
        }
      }
    }

    // 6. Doors & Interactive Portals
    for (const o of objects) {
      const x = o.x * T;
      const y = o.y * T;

      if (o.type === 'door') {
        // Portal archway
        rect(x - 8, y - 24, 40, 48, '#131e28');
        rect(x - 10, y - 26, 44, 4, '#c2ab6d');
        rect(x - 8, y - 22, 4, 46, '#96834f');
        rect(x + 28, y - 22, 4, 46, '#96834f');
        // Heavy wood door with panels
        rect(x - 4, y - 22, 32, 44, o.locked ? '#353942' : '#3d6166');
        rect(x - 1, y - 18, 12, 16, o.locked ? '#282a30' : '#2b494d');
        rect(x + 13, y - 18, 12, 16, o.locked ? '#282a30' : '#2b494d');
        rect(x - 1, y + 2, 12, 16, o.locked ? '#282a30' : '#2b494d');
        rect(x + 13, y + 2, 12, 16, o.locked ? '#282a30' : '#2b494d');
        // Brass handle
        rect(x + 21, y + 5, 3, 5, '#eec55c');

        // Architectural Header Plaque above door
        const label = (o.to === 'corridor' ? 'CAPITOL' : o.to).toUpperCase();
        rect(x - 14, y - 39, 52, 12, '#121f28');
        rect(x - 14, y - 39, 52, 1, '#d8c279'); // gold top bevel
        rect(x - 14, y - 28, 52, 1, '#5e4e2c'); // bronze bottom shadow
        rect(x - 14, y - 39, 1, 12, '#8f7b44'); // left trim
        rect(x + 37, y - 39, 1, 12, '#8f7b44'); // right trim

        ctx.font = 'bold 8px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = o.locked ? '#76888c' : '#fcedc0';
        ctx.fillText(label, x + 12, y - 30);
        ctx.textAlign = 'left';
      } else if (o.type === 'evidence') {
        // Evidence Ledger Table
        rect(x - 2, y - 2, 28, 24, '#4f3b28');
        rect(x, y, 24, 20, '#75583b');
        rect(x + 2, y + 2, 10, 14, '#ebdcb2');
        rect(x + 13, y + 2, 9, 14, '#b03b2e'); // red bound Constitution
        rect(x + 4, y + 5, 6, 1, '#665338');
        rect(x + 15, y + 5, 5, 1, '#f2d480');
      } else {
        const near = Math.abs(o.x - player.x) + Math.abs(o.y - player.y) <= 1;
        const dir = near ? (player.x < o.x ? 'left' : player.x > o.x ? 'right' : player.y < o.y ? 'up' : 'down') : 'down';
        drawNPC(x, y, o, dir, near);
      }
    }

    // 7. Draw Player Character (Bill)
    const isWalking = keys.size > 0 || path.length > 0;
    const playerBob = reduced() ? 0 : isWalking ? (Math.floor(frame / 6) % 2) : (Math.floor(frame / 24) % 2);
    drawBill(player.x * T, player.y * T, facing, playerBob, isWalking);

    // 8. Interaction Markers & Indicators
    const near = nearest();
    for (const o of objects) {
      const isTarget = (o.id === 'main' && room === roomFor(phase)) ||
        (o.type === 'door' && (room === 'corridor' ? o.to === roomFor(phase) : room !== roomFor(phase) && o.to === 'corridor')) ||
        o === near;

      if (isTarget) {
        const mx = o.x * T + 10;
        const my = o.y * T - 14;
        const isFocus = o === near;

        // Bouncing indicator
        const markerBounce = reduced() ? 0 : Math.sin(frame * 0.1) * 2;
        rect(mx - 6, my - 6 + markerBounce, 14, 13, isFocus ? '#fce89f' : '#d9b657');
        rect(mx - 5, my - 5 + markerBounce, 12, 11, isFocus ? '#fff4cc' : '#edd079');

        ctx.font = 'bold 9px monospace';
        ctx.fillStyle = '#1c2830';
        ctx.fillText(isFocus ? 'E' : '!', mx - 2, my + 4 + markerBounce);
      }
    }

    // Top and bottom ambient framing
    rect(0, 0, W * T, 4, 'rgba(10, 20, 28, 0.6)');
    rect(0, H * T - 4, W * T, 4, 'rgba(8, 16, 24, 0.8)');

    if (near?.id !== lastNear) {
      lastNear = near?.id;
      onNearby(near, player);
    }
    location.x = player.x;
    location.y = player.y;
  }

  function interact(o = nearest()) {
    if (blocked()) return;
    if (!o) {
      onNearby(null, player);
      return;
    }
    if (o.type === 'door') {
      if (o.locked) {
        onInteract({ name: 'Door notice', beats: ['Your bill has not reached this room yet. Check the note above the map for your next stop.'] });
        return;
      }
      onRoom(o.to);
      return;
    }
    onInteract(o);
  }

  function step(dx, dy) {
    facing = dx < 0 ? 'left' : dx > 0 ? 'right' : dy < 0 ? 'up' : 'down';
    if (isWalkable(room, player.x + dx, player.y + dy, objects)) {
      player.x += dx;
      player.y += dy;
      onMove({ ...player });
    }
    draw();
  }

  function keydown(e) {
    if (blocked() || e.target !== canvas) return;
    const key = e.key.toLowerCase();
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 'a', 's', 'd', 'e', 'enter', ' '].includes(key)) {
      e.preventDefault();
      if (['e', 'enter', ' '].includes(key)) {
        if (!e.repeat) interact();
      } else {
        keys.add(key);
        path = [];
        arrival = null;
        if (!e.repeat) {
          const [dx, dy] = ({ arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1], arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0] })[key];
          step(dx, dy);
          last = performance.now();
        }
      }
    }
  }

  function keyup(e) {
    keys.delete(e.key.toLowerCase());
  }

  function clear() {
    keys.clear();
  }

  function go(o) {
    canvas.focus();
    if (blocked()) return;
    keys.clear();
    if (Math.abs(o.x - player.x) + Math.abs(o.y - player.y) <= 1) {
      interact(o);
      return;
    }
    path = pathTo(room, player, o, objects);
    arrival = o;
  }

  function click(e) {
    const b = canvas.getBoundingClientRect();
    const x = Math.floor((e.clientX - b.left) / b.width * W);
    const y = Math.floor((e.clientY - b.top) / b.height * H);
    const o = objects.find(o => o.x === x && Math.abs(o.y - y) <= 1);
    if (o) return go(o);
    canvas.focus();
    keys.clear();
    arrival = null;
    path = pathTo(room, player, { x, y }, objects);
    const end = path.at(-1) || player;
    if (isWalkable(room, x, y, objects) && Math.abs(end.x - x) + Math.abs(end.y - y) === 1) {
      path.push({ x, y });
    }
  }

  function loop(time) {
    if (disposed) return;
    if (!blocked() && time - last > 115) {
      last = time;
      if (path.length) {
        player = path.shift();
        onMove({ ...player });
        if (!path.length && arrival) {
          const o = arrival;
          arrival = null;
          interact(o);
        }
      } else if (keys.size) {
        if (keys.has('arrowup') || keys.has('w')) step(0, -1);
        else if (keys.has('arrowdown') || keys.has('s')) step(0, 1);
        else if (keys.has('arrowleft') || keys.has('a')) step(-1, 0);
        else if (keys.has('arrowright') || keys.has('d')) step(1, 0);
      }
    } else if (blocked()) {
      keys.clear();
      path = [];
      arrival = null;
    }
    draw();
    requestAnimationFrame(loop);
  }

  document.addEventListener('keydown', keydown);
  document.addEventListener('keyup', keyup);
  window.addEventListener('blur', clear);
  canvas.addEventListener('click', click);
  requestAnimationFrame(loop);

  return {
    go,
    objects,
    interact,
    dispose() {
      disposed = true;
      document.removeEventListener('keydown', keydown);
      document.removeEventListener('keyup', keyup);
      window.removeEventListener('blur', clear);
      canvas.removeEventListener('click', click);
    }
  };
}

function amendment() {
  const id = proposal(state);
  if (!id) return `<div class="proposal"><h3>No further changes proposed</h3><p>The proposed changes to these provisions have already been made. The bill is ready for the next decision.</p></div>${button('Return the reviewed text →', 'continue', 'class="primary"')}`;
  const c = cards[id];
  const preview = { ...state.current, [id]: 1 };
  const kind = state.phase === 'senateAmend' ? 'cloture' : state.phase === 'houseAmend' ? 'house' : 'committee';
  return `<div class="proposal"><p class="eyebrow">PROPOSED AMENDMENT ${id === state.priority ? ' · YOUR PRIORITY' : ''}</p><h3>${c.name}</h3><div class="redline"><div><span>CURRENT</span><p>${textOf(id, state.current[id])}</p></div><div><span>PROPOSED</span><p>${textOf(id, 1)}</p></div></div><p class="trade">${c.trade}</p><p class="hint">${kind === 'cloture' ? 'Cloture' : kind === 'committee' ? 'Committee report' : 'House passage'} support: ${forecast(state, kind).total} → ${forecast(state, kind, preview).total}. Costs 1 session tick.</p></div><div class="choice-row">${button('Support the amendment →', 'accept', 'class="primary"')}${button('Defend current text', 'retain')}</div><p class="hint">Adopting this amendment builds coalition support by addressing committee concerns. Defending the current text preserves your original policy language.</p>`;
}

function compare(a, b, original = false) {
  return `<div class="comparison"><div><h3>${original ? 'As introduced' : 'House-approved text'}</h3>${Object.entries(a || {}).map(([id, v]) => `<article><strong>${cards[id].name}</strong><p>${textOf(id, v)}</p></article>`).join('')}</div><div><h3>${original ? 'Current / final text' : 'Senate-approved text'}</h3>${Object.entries(b || {}).map(([id, v]) => `<article class="${a?.[id] !== v ? 'changed' : ''}"><span class="status">${a?.[id] === v ? 'UNCHANGED' : 'AMENDED'}</span><strong>${cards[id].name}</strong><p>${textOf(id, v)}</p></article>`).join('')}</div></div>`;
}

function controls() {
  if (['committee', 'markup', 'houseAmend', 'senateAmend'].includes(state.phase)) return amendment();
  if (state.phase === 'senateRoute') {
    const broad = forecast(state, 'cloture').total >= 60, id = proposal(state);
    return `<div class="proposal"><h3>${broad ? 'Senators agree on a timetable.' : 'A senator objects to the agreement.'}</h3><p>${broad ? 'Nobody objects to the proposed timetable. The Senate can reach a passage vote without cloture.' : (id ? `A senator still has concerns about how the bill would work. The proposed deal changes this wording: ${textOf(id, 1)}` : 'A senator objects to the timetable, and all compromise amendments have already been exhausted. The sponsors must seek cloture to reach a vote.')}</p></div><div class="choices">${broad ? button('Use the consent agreement · 1 tick', 'consent', 'class="primary"') : (id ? button('Accept the deal · 1 tick', 'negotiate', 'class="primary"') : '')}${button('Ask sponsors to seek cloture · 3 ticks', 'seek', !broad && !id ? 'class="primary"' : '')}${broad ? '' : button('Keep the bill as it is; stop here', 'refuse', 'class="danger-text"')}</div>`;
  }
  if (state.phase === 'reconcile') {
    return `${compare(state.house, state.senate)}${equal(state.house, state.senate) ? `<p>The texts already match. No reconciliation is needed.</p>${button('Enroll identical text →', 'identical', 'class="primary"')}` : `<div class="choice-row">${button('Propose House version', 'packageHouse')}${button('Propose Senate version →', 'packageSenate', 'class="primary"')}</div><p class="hint">The other chamber still has to agree to this version. Choosing a version does not pass it.</p>`}`;
  }
  const isVote = Boolean(voteKind(state.phase));
  return button(
    state.phase === 'president' ? 'Present the enrolled bill →' : isVote ? 'Hear the roll call →' : 'Hand the bill to the referral clerk →',
    isVote ? 'startRollCall' : 'continue',
    'class="primary"'
  );
}

function ending() {
  const changed = Object.keys(state.current).filter(id => state.current[id] !== state.introduced[id]);
  return `<section class="ending"><p class="eyebrow">THE RESULT / ${state.outcome === 'Not enacted' ? 'WHY IT STOPPED' : 'LEGISLATIVE RECORD'}</p><h1>${state.outcome}.</h1><p class="lede">${state.failure ? esc(state.failure.reason) : 'Your bill made it into law. Both chambers agreed on the same text, and it cleared the final approval. Now look at what changed along the way.'}</p><div class="result-stats"><div><strong>${3 - changed.length}/3</strong><span>original provisions unchanged</span></div><div><strong>${changed.length}</strong><span>provisions amended</span></div><div><strong>${state.current[state.priority] === state.introduced[state.priority] ? 'Preserved' : 'Amended'}</strong><span>your priority clause</span></div></div>${compare(state.introduced, state.current, true)}<div class="analysis-box"><p class="eyebrow">LOOK BACK AT YOUR BILL</p><h2>What does your bill’s story show?</h2><p>${changed.length ? `${cards[changed[0]].name} changed while lawmakers worked out what they could support. ${cards[changed[0]].trade}` : 'You kept the original wording. Lawmakers still had the power to hold it up or vote against it.'} Article I requires agreement from both chambers and presentment to the president. Chamber rules add more decisions along the way.</p><div class="choices">${button('Requiring several institutions to agree checks power, but can delay a bill or change what it does.', 'claim', 'data-value="checks"')}${button('If most people want a bill, it is guaranteed to become law.', 'claim', 'data-value="majority"')}</div>${state.claim ? `<div class="feedback" role="status">${state.claim === 'correct' ? 'That fits what happened. Federalist 51 explains how divided power creates checks; Federalist 10 explains the competing interests you heard from. Getting more people to agree can take time and change the bill.' : 'Try again. A popular bill can still stall in committee, lose a chamber vote, or face a veto. Article I, Sections 5 and 7 help explain those hurdles.'}</div>` : ''}</div><div class="choice-row">${state.checkpoint ? button('Try the last decision again', 'retry') : ''}${button('Start a new bill →', 'restart', 'class="primary"')}${button('Read the full bill history', 'file')}</div></section>`;
}

function highestRoom() {
  return Math.max(roomOrder.indexOf(roomFor(state.phase)), ...state.history.map(h => roomOrder.indexOf(roomFor(h.phase))));
}
function objective() {
  const target = roomFor(state.phase);
  if (location.room !== target) return `Find ${rooms[target].name.toLowerCase()}. That is your next stop.`;
  return state.phase === 'builder' ? 'Head to the drafting desk to put your bill together.' : state.phase === 'end' ? 'Visit the records desk to see what changed and finish your explanation.' : `Approach ${objectsFor(location.room, state.phase, highestRoom()).find(o => o.id === 'main').name}. Look for the gold marker.`;
}

function render(focus = false) {
  world?.dispose();
  const root = getApp();
  if (!root) return;
  const place = rooms[location.room];
  root.innerHTML = `${header()}<main id="main" class="world-main"><div class="room-heading"><div><p class="eyebrow">${place.subtitle}</p><h1>${place.name}</h1></div><div class="world-clock">${state.phase === 'builder' ? 'DRAFT IN PROGRESS' : state.phase === 'end' ? esc(state.outcome) : 'H.R. SIM-1'}<button type="button" class="ticks-badge" data-action="explainTicks" title="Click to learn about session ticks and the legislative calendar" aria-label="${state.ticks} session ticks remaining. Click to learn about session ticks.">${state.ticks} session ticks ⓘ</button></div></div><div class="world-objective"><span>◆</span><p>${objective()}</p></div><div class="world-frame"><canvas id="world" tabindex="0" role="application" aria-label="Explorable ${place.name}. Move with arrow keys or W A S D. E or Enter interacts nearby. Click the floor to walk; click a person to approach and talk. Accessible destinations follow the map."></canvas><div class="location-tag">${place.name.toUpperCase()}</div></div><div class="exploration-bar"><p id="nearby" aria-live="polite">Walk toward someone, or choose a destination below.</p>${button('Interact · E', 'interact', 'id="interact" disabled')}</div><div class="walk-help"><span>ARROWS / WASD <b>walk</b></span><span>E / ENTER <b>interact</b></span><span>TRACKPAD <b>click to walk</b></span><span>ESC <b>close dialogue</b></span></div><details class="destinations"><summary>People, objects & doors · keyboard / trackpad navigation</summary><div id="destinations"></div></details><p class="world-footnote">${storage ? 'Progress saved in this browser.' : 'Storage unavailable. Keep this tab open.'} Take your time. The people and vote counts are fictional; the government rules are real.</p></main>`;

  world = mountWorld(document.querySelector('#world'), {
    phase: state.phase,
    highest: highestRoom(),
    location,
    amended: Object.values(state.current).filter(v => v === 1).length,
    blocked: () => Boolean(getDialog()?.open),
    reduced: () => document.documentElement.classList.contains('reduce-motion') || matchMedia('(prefers-reduced-motion: reduce)').matches,
    onNearby: (o) => {
      document.querySelector('#nearby').textContent = o ? `${o.name}${o.locked ? ' · awaiting your bill' : ' · press E to interact'}` : 'Walk toward someone, or choose a destination below.';
      document.querySelector('#interact').disabled = !o;
    },
    onMove: (point) => {
      Object.assign(location, point);
      saveWorld();
    },
    onRoom: (room) => {
      location = { room, x: 11, y: 11 };
      saveWorld();
      conversation = null;
      render(true);
    },
    onInteract: interactObject
  });

  document.querySelector('#destinations').innerHTML = world.objects.map(o => button(`${o.type === 'door' ? '↗' : o.type === 'evidence' ? '▤' : '●'} ${o.name}${o.locked ? ' · closed' : ''}`, 'walk', `data-id="${o.id}"`)).join('');
  if (state.notice && !state.outcome && !(state.phase === 'overrideHouse' && state.notice.title === 'Regular veto')) {
    showNotice();
  } else if (focus) {
    document.querySelector('#world')?.focus();
  }
}

function chunks(text) {
  return text.match(/[^.!?]+[.!?]+|[^.!?]+$/g)?.map(t => t.trim()).filter(Boolean) || [text];
}

function startConversation(name, beats, finish = null, source = null) {
  resumeDialogue = null;
  conversation = { name, beats, index: 0, finish, source };
  showBeat();
}

function showBeat() {
  const c = conversation;
  if (!c) return;
  const last = c.index === c.beats.length - 1;
  openModal(
    esc(c.name),
    `<div class="conversation"><div class="portrait" aria-hidden="true"><span class="portrait-head"></span><span class="portrait-body"></span></div><div><p class="dialogue-beat" aria-live="polite">${esc(c.beats[c.index])}</p><span class="beat-count">${c.index + 1} / ${c.beats.length}</span></div></div><div class="dialogue-actions">${button(last ? (c.finish === 'notice' ? 'Back to the room' : c.finish === 'draft' ? 'Open the drafting desk →' : c.finish === 'ending' ? 'Read the record →' : c.finish === 'evidence' ? 'Open the ledger →' : c.finish ? 'Take a look →' : 'Back to the room') : 'Next →', 'talkNext', 'class="primary"')}${last && c.source ? button('Ask more', 'source', `data-id="${c.source}"`) : ''}</div>`
  );
  dialog.classList.add('conversation-dialog');
  dialog.querySelector('[data-action="talkNext"]')?.focus();
}

function nextBeat() {
  const c = conversation;
  if (!c) return;
  if (++c.index < c.beats.length) return showBeat();
  conversation = null;
  if (c.finish === 'draft') return openModal('Drafting desk · Emergency Alerts', builder());
  if (c.finish === 'ending') return openModal('Your legislative record', ending());
  if (c.finish === 'encounter') return openEncounter();
  if (c.finish === 'notice') return dispatch({ type: 'dismiss' });
  if (c.finish === 'evidence') return evidence();
  closeModal();
}

function interactObject(o) {
  if (o.type === 'evidence') return startConversation('Evidence shelf', ['Wondering where these rules come from? The sources are here.', 'Each entry explains what the source says and how it relates to your bill.'], 'evidence');
  if (o.id === 'main') {
    if (location.room !== roomFor(state.phase)) return startConversation(o.name, ['We are finished here for now.', objective()]);
    if (state.phase === 'builder') return startConversation('Legislative counsel', ['Let’s put your bill together. Pick three provisions from the cards on this desk.', 'Because these alerts travel across state lines, Congress can draw on its interstate commerce power. A member of Congress will need to introduce your bill.', 'Pick the provision you most want to keep. Lawmakers may still ask to change it.', 'You will choose how your coalition responds to proposed amendments as the legislation moves forward.'], 'draft', 'powers');
    if (state.phase === 'end') return startConversation('Records clerk', [state.outcome === 'Not enacted' ? 'Your bill stopped before it could become law. Let’s look at who stopped it and why.' : 'Your bill became law. Let’s compare it with the version you brought in.', 'Check what you kept, what you changed, and which decisions mattered. Then put together your explanation.'], 'ending', 'checks');
    const c = scenes[state.phase], talk = conversations[state.phase];
    return startConversation(talk?.speaker || c.actor, talk?.beats || [...chunks(c.text), ...chunks(c.lesson)], 'encounter', c.evidence);
  }
  startConversation(o.name, o.beats || ['A quiet corner of the Capitol.'], null, o.source);
}

function openEncounter() {
  const c = scenes[state.phase];
  const kind = voteKind(state.phase) || (state.phase === 'president' ? 'president' : null);

  const chamberBanner = (() => {
    if (['committee', 'markup'].includes(state.phase)) {
      return `<div class="chamber-banner chamber-committee"><span>⚖</span> COMMITTEE ON ENERGY & COMMERCE · MARKUP</div>`;
    }
    if (state.phase === 'report') {
      return `<div class="chamber-banner chamber-committee"><span>⚖</span> COMMITTEE ON ENERGY & COMMERCE · REPORT VOTE</div>`;
    }
    if (state.phase.startsWith('house') || state.phase === 'overrideHouse') {
      return `<div class="chamber-banner chamber-house"><span>🏛</span> HOUSE OF REPRESENTATIVES · FLOOR PROCEEDINGS</div>`;
    }
    if (state.phase.startsWith('senate') || state.phase === 'cloture' || state.phase === 'overrideSenate') {
      return `<div class="chamber-banner chamber-senate"><span>🦅</span> UNITED STATES SENATE · LEGISLATIVE SESSION</div>`;
    }
    if (state.phase === 'reconcile') {
      return `<div class="chamber-banner chamber-agreement"><span>▤</span> BICAMERAL CONFERENCE · AMENDMENT EXCHANGE</div>`;
    }
    if (state.phase === 'president') {
      return `<div class="chamber-banner chamber-executive"><span>★</span> THE WHITE HOUSE · PRESIDENTIAL PRESENTMENT</div>`;
    }
    return '';
  })();

  openModal(
    c.actor,
    `${chamberBanner}<div class="encounter-intro"><span class="tag">${c.tag}</span><h2>${c.title}</h2></div>${kind ? forecastPanel(kind) : ''}${state.phase === 'senateRoute' ? `<div class="dual-forecast">${forecastPanel('senate')}${forecastPanel('cloture')}</div>` : ''}${controls()}`
  );
  dialog.classList.add(kind ? 'major-encounter' : 'decision-dialog');
}

function openModal(title, body, notice = false) {
  dialog.className = '';
  lastFocus = document.activeElement;
  dialog.innerHTML = `<div class="dialog-head"><h2 id="dialog-title">${title}</h2>${button(notice ? 'Continue →' : 'Close ✕', notice ? 'dismiss' : 'close', notice ? 'class="primary"' : '')}</div><div class="dialog-body">${body}</div>`;
  if (!dialog.open) dialog.showModal();
  dialog.querySelector('button')?.focus();
}

function showNotice() {
  startConversation(state.notice.title, chunks(state.notice.text), 'notice');
}

function closeModal() {
  if (resumeDialogue) {
    conversation = resumeDialogue;
    resumeDialogue = null;
    showBeat();
    return;
  }
  conversation = null;
  dialog.close();
  document.querySelector('#world')?.focus();
}

function file() {
  openModal('Your bill file', `${state.introduced ? compare(state.introduced, state.current, true) : '<p>Your bill history starts when a member introduces it.</p>'}<h3>What happened along the way</h3><ol class="history">${state.history.map(h => `<li><strong>${esc(h.actor)}</strong><p>${esc(h.text)}</p></li>`).join('')}</ol><p>The original copy stays in this file. Retrying a decision takes you back to an earlier point in the game.</p>`);
}

function evidence(id) {
  if (conversation && dialog.classList.contains('conversation-dialog')) resumeDialogue = { ...conversation };
  const entries = id ? [[id, sources[id]]] : Object.entries(sources);
  openModal('Evidence ledger', entries.map(([key, s]) => `<article class="source"><span class="tag">${s.tag}</span><h3>${s.title}</h3><p>${s.text}</p><p class="hint">${state.evidence.includes(key) ? 'Used in your bill’s story' : 'More background'}</p><a href="${s.url}" target="_blank" rel="noopener noreferrer">Read the source ↗</a></article>`).join(''));
}

// Tension-filled Recorded Roll Call overlay
function triggerRollCall(kind) {
  const f = forecast(state, kind);
  const passed = f.total >= f.threshold;
  const nays = f.max - f.total;
  const pct = Math.min(100, Math.max(0, (f.total / f.max) * 100));
  const threshPct = Math.min(100, Math.max(0, (f.threshold / f.max) * 100));
  const isReduced = document.documentElement.classList.contains('reduce-motion') || matchMedia('(prefers-reduced-motion: reduce)').matches;

  const titles = {
    report: { badge: 'COMMITTEE ON ENERGY & COMMERCE', title: 'Full Committee Report Vote', body: '25 committee members voting' },
    houseRule: { badge: 'HOUSE OF REPRESENTATIVES', title: 'Adoption of Structured Rule', body: '435 members present and voting' },
    houseVote: { badge: 'HOUSE OF REPRESENTATIVES', title: 'Final Passage of H.R. SIM-1', body: '435 members present and voting' },
    cloture: { badge: 'UNITED STATES SENATE', title: 'Vote on Cloture (Senate Rule XXII)', body: '100 senators duly chosen and sworn' },
    senateVote: { badge: 'UNITED STATES SENATE', title: 'Final Passage in the Senate', body: '100 senators voting' },
    houseConcur: { badge: 'HOUSE OF REPRESENTATIVES', title: 'Concurrence in Senate Amendment', body: '435 members voting' },
    senateConcur: { badge: 'UNITED STATES SENATE', title: 'Concurrence in House Amendment', body: '100 senators voting' },
    overrideHouse: { badge: 'HOUSE OF REPRESENTATIVES', title: 'Veto Override Reconsideration', body: 'Two-thirds supermajority required' },
    overrideSenate: { badge: 'UNITED STATES SENATE', title: 'Veto Override Reconsideration', body: 'Two-thirds supermajority required' }
  }[state.phase] || { badge: 'LEGISLATIVE VOTE', title: 'Recorded Roll Call', body: 'Members voting' };

  openModal(titles.title, `
    <div class="rollcall-wrap">
      <span class="rollcall-badge">${titles.badge}</span>
      <h2 class="rollcall-title">${titles.title}</h2>
      <p class="rollcall-sub">${titles.body} · ${f.threshold} affirmative votes required to pass</p>
      <div class="tally-grid">
        <div class="tally-box yea">
          <span class="tally-label">YEAS (IN FAVOR)</span>
          <strong id="roll-yeas">${isReduced ? f.total : 0}</strong>
          <span class="tally-needed">Needed to pass: ${f.threshold}</span>
        </div>
        <div class="tally-box nay">
          <span class="tally-label">NAYS (OPPOSED)</span>
          <strong id="roll-nays">${isReduced ? nays : 0}</strong>
          <span class="tally-needed">Total chamber size: ${f.max}</span>
        </div>
      </div>
      <div class="roll-meter-wrap">
        <div id="roll-meter-fill" class="roll-meter-fill" style="width: ${isReduced ? pct : 0}%"></div>
        <div class="roll-threshold-marker" style="left: ${threshPct}%">
          <span class="roll-threshold-label">${f.threshold} TO PASS</span>
        </div>
      </div>
      <div id="roll-stamp-wrap" class="roll-stamp-wrap ${isReduced ? '' : 'hidden'}">
        <div class="roll-stamp ${passed ? 'stamp-pass' : 'stamp-fail'}">${passed ? 'AGREED TO' : 'REJECTED'}</div>
        <p class="roll-summary">${passed ? `${f.total} members voted Yea, exceeding the constitutional requirement of ${f.threshold}.` : `The affirmative votes (${f.total}) fell short of the required threshold of ${f.threshold}.`}</p>
      </div>
      <div id="roll-action-btn" class="${isReduced ? '' : 'hidden'}" style="margin-top:20px">
        ${button('Record Result & Proceed →', 'confirmRollCall', 'class="primary"')}
      </div>
    </div>
  `);
  dialog.classList.add('rollcall-dialog');

  if (!isReduced) {
    const startTime = performance.now();
    const duration = 850;
    function updateTally(now) {
      if (!dialog.open) return;
      const progress = Math.min(1, (now - startTime) / duration);
      const curYeas = Math.round(f.total * progress);
      const curNays = Math.round(nays * progress);
      const curPct = pct * progress;
      const yeasEl = document.querySelector('#roll-yeas');
      const naysEl = document.querySelector('#roll-nays');
      const fillEl = document.querySelector('#roll-meter-fill');
      if (yeasEl) yeasEl.textContent = curYeas;
      if (naysEl) naysEl.textContent = curNays;
      if (fillEl) fillEl.style.width = `${curPct}%`;

      if (progress < 1) {
        requestAnimationFrame(updateTally);
      } else {
        const stampEl = document.querySelector('#roll-stamp-wrap');
        const btnEl = document.querySelector('#roll-action-btn');
        if (stampEl) stampEl.classList.remove('hidden');
        if (btnEl) btnEl.classList.remove('hidden');
        btnEl?.querySelector('button')?.focus();
      }
    }
    requestAnimationFrame(updateTally);
  }
}

// Official Institutional Autopsy Ceremony
function showFailureCeremony() {
  const failPhase = state.failure?.phase || state.phase;
  const hurdleName = {
    report: 'Committee Gatekeeping Defeat',
    houseVote: 'Defeated on the House Floor',
    cloture: 'Senate Filibuster / Cloture Shortfall',
    senateRoute: 'Unanimous Consent Standoff / Filibuster',
    senateVote: 'Defeated on the Senate Floor',
    houseConcur: 'Bicameral Concurrence Rejection',
    senateConcur: 'Bicameral Concurrence Rejection',
    overrideHouse: 'Veto Sustained in the House',
    overrideSenate: 'Veto Sustained in the Senate'
  }[failPhase] || 'Session Adjournment Sine Die';

  openModal('Bill Not Enacted', `
    <div class="ceremony">
      <span class="ceremony-badge">CONGRESSIONAL RECORD · BILL DISPOSITION</span>
      <div class="roll-stamp stamp-fail" style="margin: 12px 0 16px;">NOT ENACTED</div>
      <h1>${hurdleName}</h1>
      <p class="ceremony-sub">${esc(state.failure?.reason || 'The bill stalled before clearing all constitutional hurdles.')}</p>
      <div class="autopsy-box">
        <h3>Institutional Autopsy</h3>
        <div class="autopsy-point">
          <strong>Where the Process Stopped</strong>
          <span>${scenes[failPhase]?.actor || 'Congressional Process'} (${scenes[failPhase]?.tag || 'PROCEDURE'})</span>
        </div>
        <div class="autopsy-point">
          <strong>Constitutional Principle</strong>
          <span>As Madison warned in Federalist 51, the American legislative process creates multiple institutional veto points. A proposal must build successive, durable coalitions to survive.</span>
        </div>
      </div>
      <div class="choice-row" style="justify-content:center;margin-top:20px">
        ${state.checkpoint ? button('Try the last decision again', 'retry', 'class="primary"') : ''}
        ${button('Review Full History & Debrief', 'viewDebrief')}
        ${button('Start a new bill', 'restart')}
      </div>
    </div>
  `);
}

// Regular Veto Return Ceremony
function showVetoCeremony() {
  openModal('Regular Veto', `
    <div class="ceremony">
      <span class="ceremony-badge">EXECUTIVE MANSION · ARTICLE I, SECTION 7</span>
      <div class="roll-stamp stamp-fail" style="margin: 12px 0 16px;">REGULAR VETO</div>
      <h1>Returned With Objections</h1>
      <p class="ceremony-sub">The President has refused to sign H.R. SIM-1 and returned the enrolled text to the House of Representatives.</p>
      <div class="autopsy-box">
        <h3>Presidential Veto Message</h3>
        <p>The President concluded that the bill’s compliance timeline or costs do not align with administration priorities. Under Article I, Section 7, the President cannot strike individual provisions (no line-item veto) and must veto the bill as a whole.</p>
        <p>Congress now has the constitutional authority to attempt an override. An override requires a two-thirds supermajority in both chambers on the exact, locked text.</p>
      </div>
      <div style="margin-top:20px">
        ${button('Reconsider on the House Floor →', 'dismiss', 'class="primary"')}
      </div>
    </div>
  `);
}

function dispatch(action) {
  try {
    state = reduce(state, action);
    save();
    if (['toggle', 'priority'].includes(action.type)) {
      openModal('Drafting desk · Emergency Alerts', builder());
      return;
    }
    if (action.type === 'claim') {
      openModal('Your legislative record', ending());
      return;
    }
    conversation = null;
    if (['restart'].includes(action.type)) {
      location = { room: 'corridor', x: 11, y: 11 };
      saveWorld();
    }
    if (action.type === 'retry') {
      location = { room: roomFor(state.phase), x: 11, y: 11 };
      saveWorld();
    }
    if (dialog.open) dialog.close();
    render(true);

    if (state.outcome === 'Signed into law') {
      showSigningCeremony();
    } else if (state.outcome === 'Enacted over veto') {
      showOverrideCeremony();
    } else if (state.outcome === 'Not enacted') {
      showFailureCeremony();
    } else if (state.phase === 'overrideHouse' && state.notice?.title === 'Regular veto') {
      showVetoCeremony();
    }
  } catch (e) {
    openModal('Action unavailable', `<p>${esc(e.message)}</p>`);
  }
}

function handle(e) {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const a = b.dataset.action;

  if (a === 'walk') return world.go(world.objects.find(o => o.id === b.dataset.id));
  if (a === 'interact') return world.interact();
  if (a === 'talkNext') return nextBeat();
  if (a === 'file') return file();
  if (a === 'evidence' || a === 'source') return evidence(b.dataset.id);
  if (a === 'startRollCall') return triggerRollCall(voteKind(state.phase));
  if (a === 'confirmRollCall') return dispatch({ type: 'continue' });
  if (a === 'viewDebrief') return openModal('Your legislative record', ending());
  if (a === 'retry') return dispatch({ type: 'retry' });
  if (a === 'restart') return dispatch({ type: 'restart' });

  if (a === 'close') {
    if (state.notice) return dispatch({ type: 'dismiss' });
    return closeModal();
  }
  if (a === 'explainTicks') return openModal('Session Ticks & The Legislative Calendar', `
    <article class="tick-explainer">
      <p class="lede"><strong>Session ticks simulate the scarce legislative calendar of a two-year congressional term.</strong></p>
      <h3>Constitutional Deadline: Article I &amp; the 20th Amendment</h3>
      <p>Under the U.S. Constitution, each Congress lasts exactly <strong>two years</strong> across two annual sessions. Every bill introduced is in a race against the calendar. When a Congress adjourns <em>sine die</em> at the end of its two-year term, any bill that has not been passed by both chambers and signed into law dies automatically. Bills never carry over to a new Congress; sponsors must reintroduce them from scratch.</p>
      <h3>Why Legislative Actions Cost Ticks</h3>
      <p>A legislative term has a finite number of working floor days. You begin with <strong>18 session ticks</strong> simulating that limited calendar budget:</p>
      <ul>
        <li><strong>Committee referral &amp; markup (1 tick):</strong> Committees review thousands of measures, but chairs have limited days to hold hearings, mark up text, and report bills out.</li>
        <li><strong>House special rules &amp; floor passage (1 tick):</strong> Navigating the Rules Committee and finding debate time on the busy House floor consumes calendar days.</li>
        <li><strong>Senate filibuster &amp; cloture (3 ticks):</strong> Under Senate Rule XXII, overcoming extended debate requires filing a 16-signature petition, observing a mandatory layover period, holding a vote requiring three-fifths of all senators (60 votes), and up to 30 hours of post-cloture debate.</li>
        <li><strong>Bicameral reconciliation &amp; veto overrides (1–2 ticks):</strong> Resolving House-Senate differences via amendment exchange or conference committee, or voting in both chambers to override a presidential veto, requires additional legislative days late in the session.</li>
      </ul>
      <p class="hint">Watch your tick budget in the upper right. If your ticks reach 0 before your bill becomes law, Congress adjourns and the bill dies!</p>
    </article>
  `);
  if (a === 'glossary') return openModal('Government terms', `<dl>${Object.entries(glossary).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`);
  if (a === 'settings') return openModal('Play settings', `<label class="setting"><input type="checkbox" id="motion" ${document.documentElement.classList.contains('reduce-motion') ? 'checked' : ''}> Reduce motion</label><p>Walk with arrow keys or WASD. Press E or Enter near a person or object. Click the floor to walk, or click an NPC to approach and talk. Tab reaches accessible destination buttons; these walk your character to the destination. Escape closes dialogue. This build has no audio or timed input.</p><p>Progress stays on this browser only. School policies may clear storage; the game works without it.</p><p>This version includes the Emergency Alerts bill, fixed vote counts, amendment exchange, signatures, vetoes, and overrides.</p>${button('Restart this run', 'confirmRestart', 'class="danger-text"')}`);
  if (a === 'confirmRestart') return openModal('Start over?', `<p>This clears the current run on this browser.</p>${button('Start a new bill', 'resetAll', 'class="primary"')}`);
  if (a === 'resetAll') {
    state = initial();
    location = { room: 'corridor', x: 11, y: 11 };
    conversation = null;
    save();
    dialog.close();
    return render(true);
  }
  if (a === 'toggle' && !state.draft.includes(b.dataset.id) && state.draft.length === 3) {
    document.querySelector('#selection-help').textContent = 'Deselect one of the three checked provisions first, then choose this one.';
    document.querySelector('#selection-help').setAttribute('role', 'status');
    return;
  }

  dispatch({ type: a, id: b.dataset.id, value: b.dataset.value });
  if (a === 'toggle') document.querySelector(`[data-action="toggle"][data-id="${b.dataset.id}"]`)?.focus();
}

document.addEventListener('click', handle);
document.addEventListener('change', e => {
  if (e.target.id === 'priority') {
    dispatch({ type: 'priority', id: e.target.value });
    document.querySelector('#priority')?.focus();
  }
  if (e.target.id === 'motion') {
    document.documentElement.classList.toggle('reduce-motion', e.target.checked);
    try {
      localStorage.setItem('billquest-motion', String(e.target.checked));
    } catch {}
  }
});
function init() {
  const d = getDialog();
  if (d && !d._hasCancelListener) {
    d._hasCancelListener = true;
    d.addEventListener('cancel', e => {
      e.preventDefault();
      if (state.notice) dispatch({ type: 'dismiss' });
      else closeModal();
    });
  }
  try {
    document.documentElement.classList.toggle('reduce-motion', localStorage.getItem('billquest-motion') === 'true');
  } catch {}
  render();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();

</script>
</body>
</html>
